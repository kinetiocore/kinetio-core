<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetio Core - Iniciar Sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #50E3C2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: 800;
            margin-bottom: 15px;
        }
        .logo h1 { color: #2D3748; font-size: 24px; font-weight: 700; }
        .logo p { color: #718096; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #2D3748; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #E2E8F0; border-radius: 8px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #4A90E2; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 15px; padding: 12px; border-radius: 8px;
            font-size: 14px; display: none;
        }
        .message.error { background: #FED7D7; color: #C53030; }
        .message.show { display: block; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">K</div>
            <h1>Kinetio Core</h1>
            <p>La plataforma que pone en movimiento tu negocio</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submitBtn">Iniciar sesión</button>
            <div id="message" class="message"></div>
        </form>
        
        <div class="footer">© 2026 Kinetio Studio · Todos los derechos reservados</div>
    </div>

    <script>
        (function() {
            'use strict';
            
            if (typeof window.supabase === 'undefined') {
                alert('Error: No se pudo cargar Supabase.');
                return;
            }
            
            const SUPABASE_URL = 'https://fipcubgwvqabwpplpkvx.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_zaAj4M7TFUD2eTvrBl9jRA_nlRHjxCp';
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            const form = document.getElementById('loginForm');
            const message = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Verificar si ya hay sesión activa
            supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    window.location.href = 'dashboard.html';
                }
            });
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                message.className = 'message';
                message.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Conectando...';
                
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    
                    if (error) throw error;
                    
                    // Verificar perfil
                    const { data: profile, error: profileError } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();
                    
                    if (profileError) throw profileError;
                    
                    // Guardar sesión en localStorage
                    localStorage.setItem('kinetio_user', JSON.stringify(profile));
                    
                    // Redirigir al dashboard
                    window.location.href = 'dashboard.html';
                    
                } catch (error) {
                    message.className = 'message error show';
                    message.textContent = '❌ ' + (error.message || 'Error desconocido');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Iniciar sesión';
                }
            });
        })();
    </script>
</body>
</html>
