<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetio Core - Iniciar Sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #4A90E2 0%, #50E3C2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: 800;
            margin-bottom: 15px;
        }
        .logo h1 { color: #2D3748; font-size: 24px; font-weight: 700; }
        .logo p { color: #718096; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #2D3748; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #E2E8F0; border-radius: 8px;
            font-size: 15px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #4A90E2; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #4A90E2, #50E3C2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .message {
            margin-top: 15px; padding: 12px; border-radius: 8px;
            font-size: 14px; display: none;
        }
        .message.error { background: #FED7D7; color: #C53030; border: 1px solid #FEB2B2; }
        .message.success { background: #C6F6D5; color: #22543D; border: 1px solid #9AE6B4; }
        .message.show { display: block; }
        .status-box {
            margin-top: 15px; padding: 10px;
            background: #EDF2F7; border-radius: 8px;
            font-size: 12px; color: #4A5568;
            font-family: monospace; word-break: break-all;
        }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">K</div>
            <h1>Kinetio Core</h1>
            <p>La plataforma que pone en movimiento tu negocio</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submitBtn">Iniciar sesión</button>
            <div id="message" class="message"></div>
            <div id="statusBox" class="status-box" style="display:none;"></div>
        </form>
        
        <div class="footer">© 2026 Kinetio Studio · Todos los derechos reservados</div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // Verificar que Supabase cargó
            if (typeof window.supabase === 'undefined') {
                alert('Error: No se pudo cargar Supabase. Revisa tu conexión.');
                return;
            }
            
            const SUPABASE_URL = 'https://fipcubgwvqabwpplpkvx.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_zaAj4M7TFUD2eTvrBl9jRA_nlRHjxCp';
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            const form = document.getElementById('loginForm');
            const message = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');

            function showMessage(text, type) {
                message.className = 'message ' + type + ' show';
                message.textContent = text;
            }

            function showStatus(text) {
                statusBox.style.display = 'block';
                statusBox.textContent = text;
                console.log('[Kinetio]', text);
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                
                message.className = 'message';
                message.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Conectando...';
                showStatus('1. Enviando credenciales a Supabase...');
                
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    
                    if (error) throw error;
                    
                    showStatus('2. Login exitoso. UID: ' + data.user.id);
                    submitBtn.textContent = 'Obteniendo perfil...';
                    
                    const { data: profile, error: profileError } = await supabaseClient
                        .from('profiles')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();
                    
                    if (profileError) throw profileError;
                    
                    showStatus('3. Perfil: ' + profile.nombre_completo + ' (' + profile.rol + ')');
                    showMessage('✅ ¡Bienvenido ' + profile.nombre_completo + '! Rol: ' + profile.rol, 'success');
                    submitBtn.textContent = '✓ Sesión iniciada';
                    submitBtn.disabled = false;
                    
                } catch (error) {
                    console.error('Error:', error);
                    showStatus('ERROR: ' + (error.message || error.toString()));
                    showMessage('❌ ' + (error.message || 'Error desconocido'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Iniciar sesión';
                }
            });
        })();
    </script>
</body>
</html>
